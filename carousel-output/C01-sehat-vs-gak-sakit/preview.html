<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview Carousel</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --navy:#0B233D; --blue:#417697; --hl:#4B7B98; --red:#AB2224; --white:#fff;
  --grid:rgba(173,216,255,.12); --glass:rgba(255,255,255,.08); --glass-line:rgba(255,255,255,.55);
  --mind:#8B6CF0; --fitness:#C8F03C; --nutrition:#FFD23F; --health:#37D3C2; --longevity:#7CC7FF; --aesthetics:#FF9EC4;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#071522;font-family:Poppins,system-ui,sans-serif;color:#fff;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.toolbar{flex:none;display:flex;gap:10px;align-items:center;padding:10px 16px;background:#0a1c2e;border-bottom:1px solid #1d3a55;font-size:13px}
.toolbar button{background:#16324d;color:#fff;border:1px solid #2b5578;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.toolbar button:hover{background:#1d4468}
.toolbar .title{font-weight:600;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .info{opacity:.75}
.body{flex:1;min-height:0;display:flex}
.viewport{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.notes{flex:none;width:300px;background:#0a1c2e;border-left:1px solid #1d3a55;padding:16px;font-size:12.5px;line-height:1.5;overflow:auto}
.notes h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:12px 0 4px}
.notes h4:first-child{margin-top:0}
body.export .toolbar,body.export .notes{display:none}
@media (max-width:900px){.notes{display:none}}

.stage{width:1080px;height:1350px;flex:none;transform-origin:center center;position:relative;overflow:hidden;border-radius:0;
  background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);background-size:54px 54px}
.stage::after{content:"";position:absolute;width:900px;height:900px;border-radius:50%;right:-380px;bottom:-300px;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%);pointer-events:none}

/* chrome */
.logo{position:absolute;top:56px;left:0;right:0;display:flex;justify-content:center;z-index:5}
.logo img{height:92px}
.wm{font-weight:800;font-size:84px;letter-spacing:-.04em;line-height:.8;text-align:center}
.wm small{display:block;font-size:13px;letter-spacing:.32em;font-weight:700;margin-top:16px}
.dots3{position:absolute;top:84px;left:64px;display:flex;gap:14px;z-index:5}
.dots3 i{width:22px;height:22px;border-radius:50%;background:rgba(173,216,255,.55)}
.dots3 i.on{background:#cfe9ff}
.next{position:absolute;right:64px;bottom:64px;width:104px;height:104px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center;z-index:5}
.next svg{width:52px;height:52px}
.pager{position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:5}
.pager i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35)}
.pager i.on{background:#fff}

.slide{position:absolute;inset:0;display:none}
.slide.active{display:block}
.pad{position:absolute;left:80px;right:80px;top:190px;bottom:200px;display:flex;flex-direction:column;justify-content:center;gap:36px}
.center{align-items:center;text-align:center}

/* text system */
.h1{font-size:104px;line-height:1.18;font-weight:800;letter-spacing:-.02em}
.h2{font-size:64px;line-height:1.2;font-weight:700}
.body-t{font-size:44px;line-height:1.4;font-weight:500}
.sm{font-size:34px;line-height:1.4;font-weight:500;opacity:.92}
.hl{background:var(--hl);padding:.02em .26em;border-radius:.2em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tbox .hl,.card .hl{background:rgba(11,35,61,.55)}
.red{background:var(--red);padding:.02em .26em;border-radius:.2em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pill{display:inline-block;background:#fff;color:var(--navy);font-weight:700;border-radius:22px;padding:8px 30px;font-size:46px}
.kick{display:inline-block;border:3px solid rgba(255,255,255,.8);border-radius:999px;padding:8px 30px;font-size:34px;font-weight:500;letter-spacing:.01em}
.ghost{position:absolute;font-weight:800;font-size:300px;letter-spacing:-.04em;color:rgba(255,255,255,.07);white-space:nowrap;left:50%;top:32%;transform:translateX(-50%);pointer-events:none}
.card{border:4px solid var(--glass-line);border-radius:64px;background:var(--glass);backdrop-filter:blur(6px);padding:56px}
.tbox{background:#3d7396;border-radius:40px;padding:48px 52px}
.asset{border:4px dashed rgba(255,255,255,.5);border-radius:40px;display:grid;place-items:center;text-align:center;padding:28px;font-size:30px;opacity:.9;background:rgba(255,255,255,.05);min-height:260px}
.asset b{display:block;font-size:26px;letter-spacing:.1em;opacity:.7;margin-bottom:8px}
.ico{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--navy)}
.ico svg{width:84px;height:84px}
.row{display:flex;gap:28px}
.col{flex:1;min-width:0}
.num{font-size:260px;font-weight:800;line-height:.8;color:rgba(255,255,255,.24);letter-spacing:-.05em}

/* motion — elemen mulai tak terlihat, .play memutar */
[data-m]{opacity:0}
.slide.play [data-m]{animation-duration:.8s;animation-fill-mode:both;animation-timing-function:var(--ease);animation-delay:calc(var(--d,0)*1s)}
.slide.play [data-m=rise]{animation-name:rise}
.slide.play [data-m=pop]{animation-name:pop;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
.slide.play [data-m=stamp]{animation-name:stamp;animation-duration:.55s}
.slide.play [data-m=wipe]{animation-name:wipe;animation-duration:.9s}
.slide.play [data-m=slide-l]{animation-name:slidel}
.slide.play [data-m=slide-r]{animation-name:slider}
.slide.play [data-m=fade]{animation-name:fade;animation-duration:1s}
.slide.play [data-m=float]{animation-name:fadepop,float;animation-duration:.6s,4s;animation-delay:calc(var(--d,0)*1s),calc(var(--d,0)*1s + .6s);animation-iteration-count:1,infinite;animation-timing-function:var(--ease),ease-in-out}
.slide.play [data-m=pulse]{animation-name:fade,pulse;animation-duration:.5s,1.6s;animation-delay:calc(var(--d,0)*1s),calc(var(--d,0)*1s + .5s);animation-iteration-count:1,infinite}
.slide.play [data-m=nudge]{animation-name:fade,nudge;animation-duration:.5s,1.4s;animation-delay:calc(var(--d,0)*1s),calc(var(--d,0)*1s + .5s);animation-iteration-count:1,infinite}
.slide.play [data-m=scribble]{animation-name:scribble;animation-duration:.8s}
@keyframes rise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(1.9) rotate(-10deg)}70%{opacity:1;transform:scale(.94) rotate(var(--rot,-6deg))}100%{opacity:1;transform:scale(1) rotate(var(--rot,-6deg))}}
@keyframes wipe{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes slidel{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
@keyframes slider{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadepop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
@keyframes scribble{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.bar{height:84px;border-radius:24px;background:#fff;transform-origin:left;width:calc(var(--w)*1%)}
.slide.play .bar{animation:grow 1.1s var(--ease) both;animation-delay:calc(var(--d,0)*1s + .2s)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.caret{display:inline-block;width:4px;height:1em;background:currentColor;margin-left:4px;animation:blink 1s steps(1) infinite;vertical-align:-.1em}
@keyframes blink{50%{opacity:0}}
body.final [data-m],body.final .bar{animation:none!important;opacity:1!important;clip-path:none!important}

/* playful */
.tag{display:inline-block;transform:rotate(var(--rot,-3deg));font-weight:800;color:var(--navy);border-radius:14px;padding:8px 34px}
.tag.cat{font-size:104px;line-height:1.05;background:var(--pc,var(--fitness))}
.tag.name{background:#fff;font-size:40px;padding:12px 26px;line-height:1.2}
.tag.role{background:#cfe6ff;font-size:38px;padding:10px 26px;margin-top:-6px;line-height:1.2}
.sticker{background:linear-gradient(135deg,#d6283a,var(--red));color:#fff;border-radius:28px;padding:22px 34px;transform:rotate(var(--rot,-6deg));font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.quote{font-style:italic;font-weight:500;font-size:40px;line-height:1.35}
.scr{height:14px;border-radius:10px;background:var(--fitness);margin-top:10px;width:78%}
.photo{position:absolute;bottom:0;display:flex;align-items:flex-end;justify-content:center;font-size:34px}
.photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(180deg,transparent,rgba(11,35,61,.75));pointer-events:none}
.photo .sil{width:100%;height:100%;border-radius:280px 280px 0 0;background:rgba(255,255,255,.12);display:grid;place-items:center;text-align:center;padding:20px;border:4px dashed rgba(255,255,255,.4);border-bottom:0}
.footer{position:absolute;left:64px;right:64px;bottom:60px;display:flex;align-items:center;justify-content:space-between;z-index:4}
.ctapill{background:var(--fitness);color:var(--navy);font-weight:800;font-size:34px;border-radius:999px;padding:18px 36px}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <span class="title" id="ttl"></span>
    <span class="info" id="pos"></span>
    <button id="prev">◀</button><button id="next">▶</button>
    <button id="replay">↻ Replay</button>
    <button id="auto">Autoplay</button>
    <button id="notesBtn">Catatan</button>
  </div>
  <div class="body">
    <div class="viewport" id="vp"><div class="stage" id="stage"></div></div>
    <aside class="notes" id="notes"></aside>
  </div>
</div>

<script id="deck" type="application/json">{"meta": {"title": "C01 · Sep W1 · B2C · Health — Sehat vs Sekadar Gak Sakit", "style": "base", "segment": "b2c", "pillar": "health"}, "slides": [{"pattern": "cover", "icon": "pulse", "ghost": "SEHAT", "kicker": "Health", "title": "{{Sehat}} ≠\nSekadar\nGak Sakit", "sub": "3 tanda yang sering kelewat.\nNomor 2 paling sering diremehkan.", "notes": {"visual": "Cover tipografi besar, simbol ≠ sebagai inti kontras. Ghost word SEHAT samar, ikon denyut di bulatan putih", "element": "Highlight biru di kata 'Sehat' (kontras vs 'Sekadar Gak Sakit' yang polos)", "motion": "Ikon pop → kicker rise → headline rise, highlight 'Sehat' menyusul → sub rise; panah next nudge", "asset": "Tidak ada"}}, {"pattern": "numbered", "num": "1", "label": "Tanda #1", "title": "Gampang capek &\nsusah fokus", "body": "Gak ada yang sakit, tapi energi kamu habis duluan.", "notes": {"visual": "Numeral besar samar di belakang, label pill, judul 2 baris, body 1 kalimat", "element": "Posisi angka & label konsisten di ketiga slide tanda", "motion": "Numeral fade → label stamp → judul rise → body rise", "asset": "Tidak ada"}}, {"pattern": "numbered", "num": "2", "label": "Tanda #2", "title": "Jarang gerak, tapi\n[[ngerasa cukup]]", "body": "Duduk seharian lalu jalan ke parkiran, itu sering belum cukup.", "notes": {"visual": "Sama seperti Tanda #1, tapi ini slide paling penting (disebut di hook dan caption)", "element": "Satu-satunya aksen merah carousel ini di 'ngerasa cukup'. Di plan merah juga dipakai di cover; digeser ke sini supaya jatah 1x terpenuhi dan jatuh di poin paling penting", "motion": "Sama dengan #1, 'ngerasa cukup' stamp merah paling akhir", "asset": "Tidak ada"}}, {"pattern": "numbered", "num": "3", "label": "Tanda #3", "title": "Cek badan baru\nkalau ada keluhan", "body": "Sehat itu dijaga sebelum ada tanda, bukan dicari setelahnya.", "notes": {"visual": "Sama seperti dua slide tanda sebelumnya", "element": "Tanda #3 ditambahkan: plan hanya merinci 2 tanda padahal hook menyebut 3. Sejalan dengan tema preventive health Sesi 2", "motion": "Sama dengan #1", "asset": "Tidak ada"}}, {"pattern": "cta", "icon": "heart", "title": "Simpan biar inget lagi 📌", "sub": "Kirim ke teman yang suka bilang\n“gue sehat kok”", "handle": "Follow @shape.indonesia", "notes": {"visual": "Penutup tenang: kotak biru + pill handle lime, tanpa panah next", "element": "CTA simpan & share (B2C edukasi, bukan daftar webinar)", "motion": "Ikon pop → kotak rise → sub rise → handle pulse", "asset": "Tidak ada"}}]}</script>
<script>
const CAPTURE = new URLSearchParams(location.search).has('capture');
const DECK = JSON.parse(document.getElementById('deck').textContent);
const META = DECK.meta || {};
const SLIDES = DECK.slides;
const playful = META.style === 'playful';
const PC = {mind:'#8B6CF0',fitness:'#C8F03C',nutrition:'#FFD23F',health:'#37D3C2',longevity:'#7CC7FF',aesthetics:'#FF9EC4'};
const ICONS = {
 brain:'<path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V4a3 3 0 0 0-3 0zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/>',
 dumbbell:'<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
 bowl:'<path d="M3 12h18a9 9 0 0 1-18 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"/>',
 heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
 leaf:'<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l8-8"/>',
 spark:'<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>',
 check:'<path d="M4 12.5l5 5L20 6.5"/>',
 pulse:'<path d="M2 12h5l2-6 4 12 2-6h7"/>',
 moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>',
 drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 arrow:'<path d="M4 12h15M13 5l7 7-7 7"/>'
};
const svg = (n,sw=2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||ICONS.spark}</svg>`;
const fmt = s => (s==null?'':String(s)).replace(/\{\{(.+?)\}\}/g,'<span class="hl">$1</span>').replace(/\[\[(.+?)\]\]/g,'<span class="red">$1</span>').replace(/\n/g,'<br>');
const m = (type,d=0,extra='') => `data-m="${type}" data-d="${d}" data-x="${extra}"`;
const asset = (txt,d=0,h,img) => img
  ? `<div ${m('float',d)} style="text-align:center"><img src="${img}" style="max-height:${h||360}px;max-width:100%;object-fit:contain"></div>`
  : (txt ? `<div class="asset" ${m('rise',d,h?`min-height:${h}px`:'')}><div><b>ASET</b>${fmt(txt)}</div></div>` : '');
const ico = (n,d=0,c) => `<div class="ico" ${m('pop',d,c?`background:${c}`:'')}>${svg(n)}</div>`;

const P = {
 cover: s => `
  ${s.ghost?`<div class="ghost" ${m('fade',.1)}>${s.ghost}</div>`:''}
  <div class="pad center">
    ${s.icon?ico(s.icon,.1):''}
    ${s.kicker?`<div ${m('rise',.2)}><span class="kick">${fmt(s.kicker)}</span></div>`:''}
    <div class="h1" ${m('rise',.4)}>${fmt(s.title)}</div>
    ${s.sub?`<div class="body-t" ${m('rise',.8)} style="max-width:860px">${fmt(s.sub)}</div>`:''}
    ${(s.asset||s.img)?asset(s.asset,1,s.assetH||300,s.img):''}
  </div>`,
 claim: s => `
  <div class="pad" style="top:210px;bottom:210px">
   <div class="card" style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px" ${m('fade',.1)}>
    <div class="tbox" ${m('rise',.3)}>
      ${s.label?`<div style="margin-bottom:26px"><span class="pill" ${m('stamp',.45,'--rot:-2deg')}>${fmt(s.label)}</span></div>`:''}
      <div class="body-t" style="font-size:${s.size||52}px" ${m('rise',.6)}>${fmt(s.body)}</div>
    </div>
    ${(s.asset||s.img)?asset(s.asset,.9,s.assetH||360,s.img):''}
   </div>
  </div>`,
 numbered: s => `
  <div class="pad">
    <div class="num" ${m('fade',.1)}>${s.num}</div>
    <div ${m('stamp',.3,'--rot:-2deg')}><span class="pill" style="background:var(--hl);color:#fff">${fmt(s.label||('Tanda #'+s.num))}</span></div>
    <div class="h1" style="font-size:88px" ${m('rise',.5)}>${fmt(s.title)}</div>
    ${s.body?`<div class="body-t" ${m('rise',.8)}>${fmt(s.body)}</div>`:''}
    ${(s.asset||s.img)?asset(s.asset,1,s.assetH||260,s.img):''}
  </div>`,
 compare: s => `
  <div class="pad">
    ${s.title?`<div class="h2 center" style="text-align:center" ${m('rise',.1)}>${fmt(s.title)}</div>`:''}
    <div class="row" style="align-items:stretch">
      <div class="col card" style="padding:44px" ${m('slide-l',.3)}>
        <span class="pill" style="font-size:36px">${fmt(s.left.label)}</span>
        <div class="h2" style="margin:24px 0 12px">${fmt(s.left.title)}</div>
        <div class="sm">${fmt(s.left.body)}</div>
      </div>
      <div class="col card" style="padding:44px;background:rgba(75,123,152,.45)" ${m('slide-r',.5)}>
        <span class="pill" style="font-size:36px;background:${s.right.red?'var(--red)':'#fff'};color:${s.right.red?'#fff':'var(--navy)'}">${fmt(s.right.label)}</span>
        <div class="h2" style="margin:24px 0 12px">${fmt(s.right.title)}</div>
        <div class="sm">${fmt(s.right.body)}</div>
      </div>
    </div>
    ${s.foot?`<div class="body-t center" style="text-align:center" ${m('rise',1)}>${fmt(s.foot)}</div>`:''}
  </div>`,
 bars: s => `
  <div class="pad">
    <div class="h2" ${m('rise',.1)}>${fmt(s.title)}</div>
    ${s.items.map((it,i)=>`<div ${m('fade',.2+i*.2)}><div class="sm" style="margin-bottom:10px">${fmt(it.label)} <b style="float:right">${fmt(it.text||it.value)}</b></div><div class="bar" style="--w:${it.value};--d:${.2+i*.2};${it.red?'background:var(--red)':''}"></div></div>`).join('')}
    ${s.caption?`<div class="body-t" ${m('rise',1)}>${fmt(s.caption)}</div>`:''}
  </div>`,
 stat: s => `
  <div class="pad center">
    ${s.kicker?`<div ${m('rise',.1)}><span class="kick">${fmt(s.kicker)}</span></div>`:''}
    <div class="h1" style="font-size:260px;line-height:1" ${m('pop',.3)}><span class="cnt" data-to="${s.number}">${s.number}</span>${s.suffix||''}</div>
    <div class="h2" ${m('rise',.7)}>${fmt(s.label)}</div>
    ${s.body?`<div class="body-t" ${m('rise',1)} style="max-width:860px">${fmt(s.body)}</div>`:''}
  </div>`,
 list: s => `
  <div class="pad" style="top:230px;gap:24px">
    <div class="h1" style="font-size:76px;margin-bottom:6px" ${m('rise',.1)}>${fmt(s.title)}</div>
    ${s.items.map((t,i)=>`<div class="row card" style="padding:22px 34px;align-items:center;border-radius:44px" ${m('slide-l',.35+i*.25)}>
        <div class="ico" style="width:76px;height:76px;flex:none;background:var(--hl);color:#fff">${svg('check',2.6)}</div>
        <div class="body-t" style="font-size:40px">${fmt(t)}</div></div>`).join('')}
  </div>`,
 search: s => `
  <div class="pad">
    <div class="card" style="padding:30px 40px;border-radius:999px;background:#fff;color:var(--navy);display:flex;align-items:center;gap:26px" ${m('rise',.1)}>
      <div style="width:64px;height:64px;flex:none">${svg('search',2.4)}</div>
      <div class="body-t" style="font-weight:600;font-size:48px;color:var(--navy)"><span class="typed" data-text="${(s.query||'').replace(/"/g,'&quot;')}">${s.query}</span><span class="caret"></span></div>
    </div>
    <div class="tbox" ${m('rise',1.4)}><div class="body-t" style="font-size:52px">${fmt(s.body)}</div></div>
    ${(s.asset||s.img)?asset(s.asset,1.8,s.assetH||300,s.img):''}
  </div>`,
 session: s => `
  <div class="pad center">
    ${s.bigLogo?`<div ${m('pop',.1)}><div class="wm" style="font-size:190px">shape<small style="font-size:26px">INDONESIA</small></div></div>`:''}
    <div ${m('fade',.1)}><span class="kick">${fmt(s.kicker||'Shape Expert Network')}</span></div>
    <div class="h1" style="font-size:96px" ${m('rise',.3)}>${fmt(s.title)}</div>
    ${s.sub?`<div class="tbox" ${m('rise',.7)}><div class="body-t">${fmt(s.sub)}</div></div>`:''}
    ${s.date?`<div class="row" style="align-items:center;gap:22px" ${m('rise',1)}><div class="ico" style="width:104px;height:104px">${svg('calendar')}</div><div class="h2">${fmt(s.date)}</div></div>`:''}
  </div>`,
 quote: s => `
  <div class="pad">
    <div class="h1" style="font-size:150px;line-height:.6;color:rgba(255,255,255,.35)" ${m('pop',.1)}>“</div>
    <div class="tbox" ${m('rise',.4)}><div class="body-t" style="font-size:50px;font-style:italic">${fmt(s.quote)}</div></div>
    <div ${m('rise',.9)}><span class="pill" style="font-size:38px">${fmt(s.who)}</span> <span class="sm">${fmt(s.role||'')}</span></div>
  </div>`,
 logos: s => `
  <div class="pad center" style="top:240px;gap:30px">
    <div class="h1" style="font-size:68px" ${m('rise',.1)}>${fmt(s.title)}</div>
    <div style="display:flex;flex-wrap:wrap;gap:22px;justify-content:center">
      ${s.logos.map((l,i)=>`<div class="asset" style="width:290px;min-height:170px;font-size:26px;background:#fff;color:var(--navy);border-color:#9bb;font-weight:700" ${m('pop',.4+i*.15)}><div><b style="color:var(--navy)">LOGO</b>${fmt(l)}</div></div>`).join('')}
    </div>
    ${s.note?`<div class="body-t" ${m('rise',1.4)}>${fmt(s.note)}</div>`:''}
  </div>`,
 timeline: s => `
  <div class="pad">
    <div class="h1" style="font-size:78px" ${m('rise',.1)}>${fmt(s.title)}</div>
    <div style="position:relative;padding-left:70px;display:flex;flex-direction:column;gap:26px">
      <div style="position:absolute;left:22px;top:20px;bottom:20px;width:6px;background:rgba(255,255,255,.35);border-radius:3px" ${m('wipe',.3)}></div>
      ${s.steps.map((t,i)=>`<div style="position:relative" ${m('rise',.5+i*.2)}>
        <div style="position:absolute;left:-60px;top:22px;width:34px;height:34px;border-radius:50%;background:#fff;border:8px solid var(--hl)"></div>
        <div class="card" style="padding:22px 34px;border-radius:36px"><div class="sm" style="opacity:.75">${fmt(t.when)}</div><div class="body-t" style="font-size:40px;font-weight:700">${fmt(t.what)}</div></div></div>`).join('')}
    </div>
  </div>`,
 speaker: s => {
  const pc = PC[s.pillar] || PC.fitness;
  const right = s.align !== 'left';           // sisi kolom teks; foto di sisi sebaliknya
  const side = right ? 'right' : 'left';
  const other = right ? 'left' : 'right';
  return `
  <div class="photo" style="${other}:0;${side}:auto;width:580px;height:800px">${s.photo?`<img src="${s.photo}" style="height:100%;object-fit:contain;object-position:bottom">`:`<div class="sil"><div><b style="display:block;opacity:.7;letter-spacing:.1em">FOTO CUTOUT</b>${fmt(s.name)}</div></div>`}</div>
  <div style="position:absolute;top:200px;${side}:64px;display:flex;flex-direction:column;align-items:flex-${right?'end':'start'};gap:22px">
    <div class="row" style="align-items:center;gap:22px" ${m('pop',.2)}>${ico(s.icon||'spark',0,pc)}</div>
    <div class="tag cat" style="--pc:${pc}" ${m('stamp',.4,'--rot:-3deg')}>${fmt(s.cat)}</div>
  </div>
  <div style="position:absolute;top:560px;${side}:64px;width:430px;display:flex;flex-direction:column;align-items:flex-${right?'end':'start'};gap:14px;text-align:${right?'right':'left'}">
    <div ${m('slide-r',.7)}><span class="tag name" style="--rot:-1.5deg">${fmt(s.name)}</span></div>
    <div ${m('slide-r',.85)}><span class="tag role" style="--rot:-1deg;margin-left:0">${fmt(s.role)}</span></div>
    ${s.quote?`<div style="margin-top:14px" ${m('rise',1.1)}><div class="quote">“${fmt(s.quote)}”</div><div class="scr" style="margin-${right?'left':'right'}:auto" ${m('scribble',1.5)}></div></div>`:''}
  </div>
  ${s.date?`<div class="sticker" style="position:absolute;${side}:64px;bottom:190px;font-size:64px;line-height:1;--rot:-6deg" ${m('stamp',1.3,'--rot:-6deg')}>${s.date}</div>`:''}
  <div class="footer" style="justify-content:${right?'flex-start':'flex-end'}"><div class="ctapill" ${m('pulse',1.6)}>Daftar via link di bio →</div></div>`;
 },
 cta: s => `
  <div class="pad center">
    ${s.icon?ico(s.icon,.1):''}
    <div class="tbox" ${m('rise',.3)}><div class="h1" style="font-size:84px">${fmt(s.title)}</div></div>
    ${s.sub?`<div class="h2" ${m('rise',.8)}>${fmt(s.sub)}</div>`:''}
    ${s.handle?`<div ${m('pulse',1.1)}><span class="pill" style="background:var(--fitness);font-size:44px">${fmt(s.handle)}</span></div>`:''}
    ${(s.asset||s.img)?asset(s.asset,1.2,s.assetH||260,s.img):''}
  </div>`
};

const stage = document.getElementById('stage');
const total = SLIDES.length;
let cur = 0, timer = null;

function chrome(i){
  const last = i === total-1;
  return `
   <div class="logo"><img src="logo-shape.png" alt="shape" onerror="this.outerHTML='<div class=&quot;wm&quot;>shape<small>INDONESIA</small></div>'"></div>
   <div class="dots3"><i class="on"></i><i></i><i></i></div>
   ${last||SLIDES[i].pattern==='speaker'?'':`<div class="next" ${m('nudge',1.6)}>${svg('arrow',2.4)}</div>`}
   <div class="pager">${SLIDES.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
}
SLIDES.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className='slide'; el.dataset.i=i;
  el.innerHTML = (P[s.pattern]||P.cover)(s) + chrome(i);
  stage.appendChild(el);
});

document.querySelectorAll('[data-m]').forEach(el=>{
  el.style.setProperty('--d', el.dataset.d||0);
  (el.dataset.x||'').split(';').forEach(kv=>{ const i=kv.indexOf(':'); if(i>0) el.style.setProperty(kv.slice(0,i).trim(), kv.slice(i+1).trim()); });
});
function typed(el){
  const t = el.dataset.text||''; if(CAPTURE){ el.textContent=t; return; } el.textContent=''; let k=0;
  const go=()=>{ if(!el.isConnected||!el.closest('.slide.play'))return; el.textContent=t.slice(0,++k); if(k<t.length) setTimeout(go,55); };
  setTimeout(go,500);
}
function counters(sl){
  sl.querySelectorAll('.cnt').forEach(c=>{
    const to = parseFloat(c.dataset.to); if(isNaN(to))return; if(CAPTURE){ c.textContent=to; return; }
    const t0=performance.now()+300, dur=1100;
    const step=now=>{ const p=Math.min(1,Math.max(0,(now-t0)/dur)); c.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1&&sl.classList.contains('play'))requestAnimationFrame(step); else c.textContent=to; };
    requestAnimationFrame(step);
  });
}
function show(i, replay){
  cur = (i+total)%total;
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active','play'));
  const sl = document.querySelector(`.slide[data-i="${cur}"]`);
  sl.classList.add('active'); void sl.offsetWidth; sl.classList.add('play');
  sl.querySelectorAll('.typed').forEach(typed); counters(sl);
  document.getElementById('pos').textContent = `Slide ${cur+1}/${total} · ${SLIDES[cur].pattern}`;
  renderNotes(SLIDES[cur]);
}
function renderNotes(s){
  const n = s.notes||{};
  const row=(h,v)=>v?`<h4>${h}</h4><div>${v}</div>`:'';
  document.getElementById('notes').innerHTML =
    row('Pola', s.pattern) + row('Visual', n.visual) + row('Elemen', n.element) + row('Motion', n.motion) + row('Aset dibutuhkan', n.asset);
}
function fit(){
  const vp = document.getElementById('vp');
  const s = Math.min(vp.clientWidth/1080, vp.clientHeight/1350, 1.2);
  stage.style.transform = `scale(${s})`;
  stage.style.margin = `${-(1350*(1-s))/2}px ${-(1080*(1-s))/2}px`;
}
addEventListener('resize', fit);

document.getElementById('ttl').textContent = META.title || 'Carousel';
document.getElementById('prev').onclick = ()=>show(cur-1);
document.getElementById('next').onclick = ()=>show(cur+1);
document.getElementById('replay').onclick = ()=>show(cur);
document.getElementById('notesBtn').onclick = ()=>{const n=document.getElementById('notes'); n.style.display = n.style.display==='none'?'block':'none'; fit();};
document.getElementById('auto').onclick = e=>{
  if(timer){clearInterval(timer);timer=null;e.target.textContent='Autoplay';}
  else{timer=setInterval(()=>show(cur+1),5500);e.target.textContent='Stop';}
};
addEventListener('keydown', e=>{ if(e.key==='ArrowRight')show(cur+1); if(e.key==='ArrowLeft')show(cur-1); if(e.key==='r')show(cur); });

const q = new URLSearchParams(location.search);
if(q.get('export')) document.body.classList.add('export');
if(q.get('final')) document.body.classList.add('final');
fit();
show(parseInt(q.get('slide')||'1',10)-1);
document.fonts && document.fonts.ready.then(fit);
</script>
</body>
</html>
